<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>光鸭 Telegram 检索机器人</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #d9dee7;
        --text: #172033;
        --muted: #657083;
        --primary: #1f7a5a;
        --primary-dark: #176248;
        --danger: #b42318;
        --shadow: 0 8px 24px rgba(23, 32, 51, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .wrap {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }
      .topbar {
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0;
      }
      main {
        padding: 28px 0 44px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 20px;
        align-items: start;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }
      .panel h2 {
        margin: 0;
        padding: 18px 20px;
        font-size: 16px;
        border-bottom: 1px solid var(--line);
      }
      form {
        padding: 20px;
        display: grid;
        gap: 16px;
      }
      label {
        display: grid;
        gap: 7px;
        font-size: 13px;
        color: var(--muted);
      }
      input, select {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        color: var(--text);
        background: #fff;
        font-size: 14px;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
        padding: 0 2px;
      }
      .switch input {
        width: 20px;
        min-height: 20px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding-top: 4px;
      }
      button {
        border: 0;
        border-radius: 6px;
        min-height: 38px;
        padding: 8px 14px;
        cursor: pointer;
        color: #fff;
        background: var(--primary);
        font-size: 14px;
      }
      button:hover { background: var(--primary-dark); }
      button.secondary {
        color: var(--text);
        background: #edf1f5;
      }
      button.secondary:hover { background: #e1e7ee; }
      button.danger {
        background: var(--danger);
      }
      .side {
        padding: 18px;
        display: grid;
        gap: 14px;
      }
      .status {
        display: grid;
        gap: 10px;
      }
      .status div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 9px;
        color: var(--muted);
        font-size: 13px;
      }
      .status strong {
        color: var(--text);
        text-align: right;
      }
      .notice {
        min-height: 22px;
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 860px) {
        .grid { grid-template-columns: 1fr; }
        .row { grid-template-columns: 1fr; }
        .topbar { align-items: flex-start; flex-direction: column; padding: 16px 0; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap topbar">
        <h1>光鸭 Telegram 检索机器人</h1>
        <div class="notice" id="notice"></div>
      </div>
    </header>
    <main class="wrap grid">
      <section class="panel">
        <h2>运行配置</h2>
        <form id="configForm">
          <label>
            Telegram Bot Token
            <input id="telegram_bot_token" name="telegram_bot_token" autocomplete="off" placeholder="留空表示不修改已有 token" />
          </label>
          <label>
            光鸭 API 地址
            <input id="guangya_api_base" name="guangya_api_base" placeholder="http://154.201.75.36:8000" />
          </label>
          <label>
            光鸭 API Key
            <input id="guangya_api_key" name="guangya_api_key" autocomplete="off" placeholder="留空表示不修改已有 key" />
          </label>
          <div class="row">
            <label>
              每页显示数量
              <input id="page_size" name="page_size" type="number" min="1" max="50" step="1" />
            </label>
            <label>
              最多显示数量
              <input id="max_results" name="max_results" type="number" min="0" step="1" />
            </label>
          </div>
          <div class="row">
            <label>
              状态过滤
              <input id="status" name="status" placeholder="留空为全部" />
            </label>
            <label>
              请求超时秒数
              <input id="request_timeout_seconds" name="request_timeout_seconds" type="number" min="3" max="120" step="1" />
            </label>
          </div>
          <label class="switch">
            Bot 启用
            <input id="bot_enabled" name="bot_enabled" type="checkbox" />
          </label>
          <div class="row">
            <label>
              后台用户名
              <input id="web_username" name="web_username" />
            </label>
            <label>
              后台密码
              <input id="web_password" name="web_password" type="password" placeholder="留空表示不修改" />
            </label>
          </div>
          <div class="actions">
            <button type="submit">保存配置</button>
            <button class="secondary" type="button" id="restartBtn">重启 Bot</button>
            <button class="secondary" type="button" id="startBtn">启动 Bot</button>
            <button class="danger" type="button" id="stopBtn">停止 Bot</button>
          </div>
        </form>
      </section>
      <aside class="panel side">
        <h2>状态</h2>
        <div class="status">
          <div><span>Bot</span><strong id="bot_running">-</strong></div>
          <div><span>Telegram Token</span><strong id="telegram_bot_token_set">-</strong></div>
          <div><span>API Key</span><strong id="guangya_api_key_set">-</strong></div>
          <div><span>光鸭 API</span><strong id="guangya_api_ok">-</strong></div>
          <div><span>每页</span><strong id="page_size_label">-</strong></div>
          <div><span>最多</span><strong id="max_results_label">-</strong></div>
        </div>
        <button class="secondary" type="button" id="refreshBtn">刷新状态</button>
      </aside>
    </main>
    <script>
      const notice = document.getElementById("notice");
      const fields = [
        "guangya_api_base",
        "page_size",
        "max_results",
        "status",
        "request_timeout_seconds",
        "bot_enabled",
        "web_username",
      ];

      function show(message) {
        notice.textContent = message;
        clearTimeout(window.__noticeTimer);
        window.__noticeTimer = setTimeout(() => (notice.textContent = ""), 3500);
      }

      async function api(path, options = {}) {
        const res = await fetch(path, {
          headers: { "Content-Type": "application/json", ...(options.headers || {}) },
          ...options,
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      }

      function yesNo(value) {
        return value ? "是" : "否";
      }

      function applyConfig(data) {
        for (const id of fields) {
          const el = document.getElementById(id);
          if (!el) continue;
          if (el.type === "checkbox") el.checked = Boolean(data[id]);
          else el.value = data[id] ?? "";
        }
        document.getElementById("telegram_bot_token").value = "";
        document.getElementById("guangya_api_key").value = "";
        document.getElementById("web_password").value = "";
        document.getElementById("bot_running").textContent = data.bot_running ? "运行中" : "未运行";
        document.getElementById("telegram_bot_token_set").textContent = yesNo(data.telegram_bot_token_set);
        document.getElementById("guangya_api_key_set").textContent = yesNo(data.guangya_api_key_set);
        document.getElementById("page_size_label").textContent = data.page_size;
        document.getElementById("max_results_label").textContent = data.max_results === 0 ? "不限" : data.max_results;
      }

      async function load() {
        const config = await api("/api/config");
        applyConfig(config);
        try {
          const health = await api("/api/health");
          document.getElementById("guangya_api_ok").textContent = health.guangya_api_ok ? "正常" : "异常";
        } catch {
          document.getElementById("guangya_api_ok").textContent = "未知";
        }
      }

      document.getElementById("configForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const body = {};
        for (const el of event.currentTarget.elements) {
          if (!el.name) continue;
          if (el.type === "checkbox") body[el.name] = el.checked;
          else if (["page_size", "max_results", "request_timeout_seconds"].includes(el.name)) body[el.name] = Number(el.value);
          else if (["telegram_bot_token", "guangya_api_key", "web_password"].includes(el.name)) {
            if (el.value !== "") body[el.name] = el.value;
          } else body[el.name] = el.value;
        }
        const data = await api("/api/config", { method: "PUT", body: JSON.stringify(body) });
        applyConfig(data);
        show("配置已保存");
      });

      document.getElementById("restartBtn").onclick = async () => {
        const data = await api("/api/bot/restart", { method: "POST" });
        show(data.message);
        await load();
      };
      document.getElementById("startBtn").onclick = async () => {
        const data = await api("/api/bot/start", { method: "POST" });
        show(data.message);
        await load();
      };
      document.getElementById("stopBtn").onclick = async () => {
        const data = await api("/api/bot/stop", { method: "POST" });
        show(data.message);
        await load();
      };
      document.getElementById("refreshBtn").onclick = load;
      load().catch((err) => show(err.message || "加载失败"));
    </script>
  </body>
</html>
